name: Mantener app despierta

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Abrir la app como un visitante real
        env:
          APP_URL: https://TU-APP.streamlit.app
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page()
              page.goto(url, timeout=90000)
              page.wait_for_timeout(10000)

              # Si la app estaba dormida, la despierta
              boton = page.get_by_text("Yes, get this app back up!")
              if boton.count() > 0:
                  print("La app estaba dormida, despertando...")
                  boton.first.click()
                  page.wait_for_timeout(20000)

              # La app vive dentro de un iframe
              app = page.frame_locator('iframe[title="streamlitApp"]')
              app.get_by_text("Administración de Encuestas").wait_for(timeout=120000)
              print("App activa")
              b.close()
          EOF
